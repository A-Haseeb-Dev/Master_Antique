<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Admin Login — Master Antique</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Crimson+Pro:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" media="screen" href="css/admin.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-box">
      <a href="../Index.html" class="login-logo">Master&nbsp;<span>Antique</span></a>
      <p class="login-subtitle">Administrator Access</p>

      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-input" placeholder="Enter username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter password" required>
        </div>
        <div id="login-error" class="login-error"></div>
        <button type="submit" class="login-btn">Sign In</button>
      </form>

      <p class="login-hint">Default: admin / admin123</p>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value.trim();
      var error = document.getElementById('login-error');

      var stored = localStorage.getItem('ma_admin_credentials');
      var creds = stored ? JSON.parse(stored) : { username: 'admin', password: 'admin123' };

      if (username === creds.username && password === creds.password) {
        localStorage.setItem('ma_admin_logged_in', 'true');
        window.location.href = 'dashboard.html';
      } else {
        error.textContent = 'Invalid username or password.';
      }
    });
  </script>
</body>
</html>
